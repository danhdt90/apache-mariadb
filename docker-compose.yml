services:
  # MariaDB Service
  mariadb:
    image: mariadb:10.11
    container_name: lamp-mariadb-10-11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-passrootDanh123@}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-lamp_db}
      MARIADB_USER: ${MARIADB_USER:-lamp_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-lamp_pass}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mariadb:/etc/mysql/conf.d
      - ./logs/mysql:/var/log/mysql
    ports:
      - "3307:3306"  # Different port to avoid conflict
    networks:
      - lamp-network
    command: --default-authentication-plugin=mysql_native_password

  # PHP-FPM Service
  php-fpm:
    build:
      context: ./docker/apache-php
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    container_name: lamp-php-fpm-82
    volumes:
      - ./src:/var/www/html
      - ./config/php:/usr/local/etc/php/conf.d
      - ./logs/php-fpm:/var/log/php-fpm
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${MARIADB_DATABASE:-lamp_db}
      - DB_USERNAME=${MARIADB_USER:-lamp_user}
      - DB_PASSWORD=${MARIADB_PASSWORD:-lamp_pass}
    depends_on:
      - mariadb
    networks:
      - lamp-network
    expose:
      - 9000

  # Nginx Web Server
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: lamp-nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php-fpm
    networks:
      - lamp-network

  # phpMyAdmin for MariaDB
  phpmyadmin-lamp:
    image: phpmyadmin/phpmyadmin:latest
    container_name: lamp-phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-passrootDanh123@}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 256M
    ports:
      - "8082:80"  # Different port to avoid conflict
    depends_on:
      - mariadb
    networks:
      - lamp-network

volumes:
  mariadb_data:
    driver: local

networks:
  lamp-network:
    driver: bridge
    name: lamp-apache-network  # Different network name