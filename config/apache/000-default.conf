# Virtual host for staging logrenove
<VirtualHost *:80>
    ServerName dev.logrenove.jp
    DocumentRoot /var/www/html/logrenove

    <Directory /var/www/html/logrenove>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # WordPress specific rules
    <Files wp-config.php>
        Require all denied
    </Files>

    <Files .htaccess>
        Require all denied
    </Files>

    ErrorLog /var/log/apache2/logrenove_error.log
    CustomLog /var/log/apache2/logrenove_access.log combined
</VirtualHost>

# Virtual host for Laravel-lab
<VirtualHost *:80>
    ServerName laravel-lab.local
    ServerAlias www.laravel-lab.local
    DocumentRoot /var/www/html/laravel-lab/public
    
    <Directory /var/www/html/laravel-lab/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Laravel routing rules
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.php [QSA,L]
        </IfModule>
    </Directory>
    
    <Directory /var/www/html/laravel-lab>
        Options FollowSymLinks
    </Directory>
    
    ErrorLog /var/log/apache2/laravel-lab_error.log
    CustomLog /var/log/apache2/laravel-lab_access.log combined
</VirtualHost>